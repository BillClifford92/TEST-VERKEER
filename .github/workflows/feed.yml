name: Files-feed bijwerken

on:
  schedule:
    # Elke 10 minuten. Let op: cron is in UTC en GitHub start soms enkele minuten later.
    # Alleen overdag op werkdagen? Gebruik dan bv.: "*/10 4-19 * * 1-5"
    - cron: "*/10 * * * *"
  workflow_dispatch: {}   # knop "Run workflow" om handmatig te testen

permissions:
  contents: write

concurrency:
  group: files-feed
  cancel-in-progress: false

jobs:
  bijwerken:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Feed maken
        env:
          # Pas deze twee aan naar jouw situatie (leeg laten = geen filter):
          WEGEN: #"A12,A50,A325,A348"
          BBOX: #"5.0,51.8,6.1,52.2"
          # Alleen files. Ook ongevallen/pech: "AbnormalTraffic,Accident,VehicleObstruction"
          TYPES: "AbnormalTraffic,Accident" #"AbnormalTraffic" voor alleen files
        run: python maak_feed.py

      - name: Opslaan als er iets veranderd is
        run: |
          git config user.name "files-feed-bot"
          git config user.email "files-feed-bot@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "Geen wijzigingen."
          else
            git commit -m "Feed bijgewerkt $(date -u +%H:%M)"
            git push
          fi
